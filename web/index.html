<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Allowance Ledger</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Allowance Ledger</p>
        <h1>Quinn and Logan</h1>
        <p class="hero-copy">Mobile-friendly tracker backed by Azure Functions and Blob Storage.</p>
      </header>

      <section class="summary-card" aria-label="Household summary">
        <div>
          <p class="section-label">Household total</p>
          <p class="summary-balance" id="household-total">$0.00</p>
        </div>
        <div class="summary-actions">
          <button id="refresh-ledger" type="button">Refresh</button>
          <button id="apply-weekly-credit" type="button">Apply weekly $5 credit</button>
        </div>
      </section>

      <section class="settings-card" aria-label="API settings">
        <form id="settings-form" class="settings-form">
          <label>
            <span>Azure Functions base URL</span>
            <input
              id="api-base-url"
              type="url"
              placeholder="https://your-function-app.azurewebsites.net/api"
            />
          </label>
          <button type="submit">Save API URL</button>
        </form>
        <p class="status-text" id="status-text" aria-live="polite"></p>
      </section>

      <section id="children" class="children-grid" aria-live="polite"></section>
    </main>

    <template id="child-template">
      <article class="child-card">
        <div class="card-header">
          <div>
            <p class="section-label child-name"></p>
            <p class="child-balance"></p>
          </div>
        </div>

        <form class="entry-form">
          <div class="form-grid">
            <label>
              <span>Type</span>
              <select name="type">
                <option value="credit">Credit</option>
                <option value="debt">Debt</option>
              </select>
            </label>
            <label>
              <span>Amount</span>
              <input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required />
            </label>
          </div>
          <label>
            <span>Note</span>
            <input name="note" type="text" maxlength="80" placeholder="Chore, purchase, reward..." />
          </label>
          <button type="submit">Add transaction</button>
        </form>

        <section class="list-section">
          <div class="list-header">
            <h2>Transactions</h2>
          </div>
          <ul class="entry-list activity-list"></ul>
        </section>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
